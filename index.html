<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BeeCuaca — Dashboard Cuaca</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <h1>🐝 BeeCuaca</h1>
  <p class="sub">Dashboard cuaca dari API publik Open-Meteo (tanpa API key).</p>
  <form id="formCari">
    <input id="kota" type="text" placeholder="Cari kota… mis. Yogyakarta" required>
    <button type="submit">Cari Cuaca</button>
  </form>
  <p id="status" class="sub"></p>
  <section id="saatIni" class="kartu" hidden></section>
  <section id="prakiraan" class="grid"></section>
</main>
<footer><small>BeeCuaca — proyek latihan oleh Muhammad Irfan Habibi (@BeeBeeCuy) · Data: Open-Meteo</small></footer>
<script src="app.js"></script>
</body>
</html>
